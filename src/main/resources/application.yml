server:
  port: ${PORT:8082}

spring:
  application:
    name: appointment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-frosty-paper-bb4zuk5w.c-15.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&currentSchema=schema_citas}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_9xhmaSHRg5jv}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Crea el schema en Neon si aun no existe (sin esto: ERROR: schema "..." does not exist)
        hbm2ddl:
          create_namespaces: true
        default_schema: schema_citas

clinic:
  services:
    patient-url: ${PATIENT_SERVICE_URL:http://${PATIENT_SERVICE_HOSTPORT:localhost:8081}}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://${NOTIFICATION_SERVICE_HOSTPORT:localhost:8083}}
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  holidays:
    # el adaptador ya antepone /api/v3/PublicHolidays/... (antes quedaba /api/v3/api/v3/...)
    base-url: https://date.nager.at
    country: CO
  reminders:
    cron: "0 */15 * * * *"
